services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8npass
      POSTGRES_DB: roadside_demo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
      - "127.0.0.1:5433:5432"
  n8n:
    image: n8nio/n8n:2.9.4
    restart: unless-stopped
    environment:
      N8N_HOST: n8n.avanciatech.com
      WEBHOOK_URL: https://n8n.avanciatech.com
      N8N_PROTOCOL: https
      N8N_SECURE_COOKIE: "true"
      N8N_TRUST_PROXY: "true"

      # (opcional) auth básica
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: demo
      N8N_BASIC_AUTH_PASSWORD: demo123

      TZ: Europe/Madrid

    volumes:
      - n8n_data:/home/node/.n8n

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@demo.com
      PGADMIN_DEFAULT_PASSWORD: Admin123
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../dashboard/.env
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: "production"

  crm-avancia:
    build:
      context: ../crm-avancia
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../crm-avancia/.env
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: "production"
      UPLOAD_DIR: "/app/uploads"
    volumes:
      - /opt/crm-avancia/uploads:/app/uploads
    depends_on:
      - postgres

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n
      - pgadmin
      - dashboard
      - crm-avancia

volumes:
  pgdata:
  n8n_data:
  pgadmin_data:
  caddy_data:
  caddy_config:
